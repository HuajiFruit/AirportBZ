name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.configuration }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        platform: [Sequoia, Tahoe]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm for ${{ matrix.platform }}
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project itlwm.xcodeproj -scheme "AirportItlwm-$PLATFORM" \
            -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > "logs/AirportItlwm-$PLATFORM.log" 2>&1 || { tail -100 "logs/AirportItlwm-$PLATFORM.log"; exit 1; }
      - name: Package kernel extension
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          products="$PWD/build/products/$CONFIGURATION"
          tag=$(python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              m = re.search(r'^##\s*\[([vV]?[0-9][^\]]*)\]', f.read(), re.M)
              print(m.group(1).strip() if m else 'v1.0.0')
          ")
          if [[ ! "$tag" =~ ^[vV] ]]; then
            tag="v$tag"
          fi
          if [[ "$CONFIGURATION" == "Release" ]]; then
            zip_name="AirportItlwm-$PLATFORM-$tag.zip"
          else
            zip_name="AirportItlwm-$PLATFORM-$tag-DEBUG.zip"
          fi
          ditto -c -k --keepParent "$products/$PLATFORM/AirportItlwm.kext" "artifacts/$zip_name"
      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-${{ matrix.platform }}-${{ matrix.configuration }}
          path: artifacts/AirportItlwm-${{ matrix.platform }}-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: logs

  release:
    name: Publish Release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AirportItlwm-*
          path: artifacts
          merge-multiple: true
      - name: Publish Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          m = re.search(r'^##\s*\[([vV]?[0-9][^\]]*)\](?:\s*-\s*[^\n]+)?\n(.*?)(?=\n^##\s*\[|\Z)', content, re.M | re.S)
          if not m:
              raise SystemExit('Error: No valid version header found in CHANGELOG.md (expected ## [vX.Y.Z])')
          tag = m.group(1).strip()
          if not tag.startswith('v') and not tag.startswith('V'):
              tag = 'v' + tag
          body = m.group(2).strip()
          with open('RELEASE_TAG.txt', 'w', encoding='utf-8') as f:
              f.write(tag)
          with open('ReleaseNotes.md', 'w', encoding='utf-8') as f:
              f.write(body + '\n')
          "

          tag=$(cat RELEASE_TAG.txt)
          title="AirportBZ $tag"

          echo "Publishing release: $tag with title: $title"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Updating title and release notes..."
            gh release edit "$tag" --title "$title" --notes-file ReleaseNotes.md
          else
            echo "Creating new release $tag..."
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file ReleaseNotes.md
          fi

          echo "Uploading release assets..."
          gh release upload "$tag" artifacts/AirportItlwm-*.zip --clobber
